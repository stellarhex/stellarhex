<div class="hero__stage">
  <div class="hero__figure">
    <canvas class="hero__halo" id="hero-halo-back" aria-hidden="true"></canvas>
    <span class="hero__mark" id="hero-mark"></span>
    <canvas class="hero__halo" id="hero-halo-front" aria-hidden="true"></canvas>
  </div>
  <div class="hero__text">
    <div class="hero__word">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        id="hero-word"
        role="img"
        aria-label="StellarHex"
      ></svg>
    </div>
    <span class="hero__motto"
      ><span class="hero__motto-part">Out of many</span> ·
      <span class="hero__motto-part">one light</span></span
    >
  </div>
</div>
