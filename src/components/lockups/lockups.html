<section class="section section--lockups" id="lockups-section" aria-labelledby="lockups-title">
  <div class="section__head">
    <p class="section__number">03</p>
    <h2 class="section__title" id="lockups-title">Lockups</h2>
    <p class="section__lead">Mark and name together, drawn to one cap height and gap.</p>
  </div>
  <ul class="grid">
    <li>
      <div class="lockup-pair">
        <figure class="plate lockup">
          <figcaption class="lockup__text">
            <span class="lockup__title">horizontal</span>
            <span class="lockup__facts" id="facts-horizontal"></span>
          </figcaption>
          <div class="lockup__drawing">
            <svg
              class="lockup__art"
              id="lockup-horizontal"
              role="img"
              aria-label="StellarHex horizontal lockup, Aperture"
            ></svg>
          </div>
        </figure>
        <figure class="plate lockup">
          <figcaption class="lockup__text">
            <span class="lockup__title">stacked</span>
            <span class="lockup__facts" id="facts-stacked"></span>
          </figcaption>
          <div class="lockup__drawing">
            <svg
              class="lockup__art"
              id="lockup-stacked"
              role="img"
              aria-label="StellarHex stacked lockup, Aperture"
            ></svg>
          </div>
        </figure>
      </div>
    </li>
  </ul>
</section>
