<section class="section section--mark" id="marks-section" aria-labelledby="marks-title">
  <div class="section__head">
    <p class="section__number">01</p>
    <h2 class="section__title" id="marks-title">Mark</h2>
    <p class="section__lead">One mark in 3 colourways, each for its own ground.</p>
  </div>
  <div class="section__body">
    <ul class="grid grid--feature">
      <li>
        <figure class="plate plate--mark">
          <svg class="plate__ground" id="ground-brand" aria-hidden="true" focusable="false"></svg>
          <svg
            class="plate__art"
            id="mark-brand"
            role="img"
            aria-label="StellarHex mark, brand"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">Brand</span>
            <span class="plate__note">On light or dark grounds</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="plate plate--mark plate--white">
          <svg class="plate__ground" id="ground-white" aria-hidden="true" focusable="false"></svg>
          <svg
            class="plate__art"
            id="mark-white"
            role="img"
            aria-label="StellarHex mark, white"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">White</span>
            <span class="plate__note">On dark grounds</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="plate plate--mark plate--black">
          <svg class="plate__ground" id="ground-black" aria-hidden="true" focusable="false"></svg>
          <svg
            class="plate__art"
            id="mark-black"
            role="img"
            aria-label="StellarHex mark, black"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">Black</span>
            <span class="plate__note">On light grounds</span>
          </figcaption>
        </figure>
      </li>
    </ul>
    <div class="mark-kit">
      <ul class="mark-kit__line">
        <li>Mark</li>
        <li>wordmark</li>
        <li>seal</li>
        <li>lockups</li>
        <li>SVG</li>
        <li>PNG</li>
      </ul>
      <a class="mark-kit__download" href="%BASE_URL%stellarhex-brand-kit.zip" download>
        <svg class="mark-kit__icon" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13.5h10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
        <span>Download · kit</span>
      </a>
    </div>
  </div>
</section>
