<section class="section section--mark" id="marks-section" aria-labelledby="marks-title">
  <div class="section__head">
    <p class="section__number">01</p>
    <h2 class="section__title" id="marks-title">Mark</h2>
    <p class="section__lead">One mark in 3 colourways, each for its own ground.</p>
  </div>
  <div class="section__body">
    <ul class="grid">
      <li>
        <figure class="plate plate--mark">
          <svg
            class="plate__art"
            id="mark-brand"
            role="img"
            aria-label="StellarHex mark, brand"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">Brand</span>
            <span class="plate__note">On light or dark grounds</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="plate plate--mark plate--white">
          <svg
            class="plate__art"
            id="mark-white"
            role="img"
            aria-label="StellarHex mark, white"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">White</span>
            <span class="plate__note">On dark grounds</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="plate plate--mark plate--black">
          <svg
            class="plate__art"
            id="mark-black"
            role="img"
            aria-label="StellarHex mark, black"
          ></svg>
          <figcaption class="plate__caption">
            <span class="plate__name">Black</span>
            <span class="plate__note">On light grounds</span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>
